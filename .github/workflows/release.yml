name: Release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Test build {0}', github.ref_name) }}

# Pushing a v* tag builds the three installers, uploads them with their auto-update
# metadata to a draft GitHub release, and publishes it once every platform succeeded.
# Running it by hand builds the same installers as workflow artifacts without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.11.1'
  PUBLISH: ${{ github.event_name == 'push' && 'always' || 'never' }}

jobs:
  draft:
    name: Prepare release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "EVB Player ${GITHUB_REF_NAME#v}"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26 ships Xcode 26, whose actool compiles the Icon Composer app icon.
          - os: macos-26
            platform: mac
          - os: windows-2022
            platform: win
          # The oldest supported Ubuntu LTS keeps the .deb installable on newer releases.
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Import the Developer ID certificate
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/ci/import-macos-certificate.sh
      - name: Write the notarization key
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      # electron-builder's bundled fpm is unreliable; the system gem is what EVB Viewer uses too.
      - name: Install fpm
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev build-essential
          sudo gem install fpm -v 1.15.1
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - run: pnpm build
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish "$PUBLISH"

      - name: Check the macOS signature and notarization
        if: matrix.platform == 'mac'
        run: |
          app="release/mac-arm64/EVB Player.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'push'
        with:
          name: evb-player-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check every installer and update file was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          for expected in "EVB-Player-$version-arm64.dmg" "EVB-Player-$version-arm64.zip" latest-mac.yml \
            "EVB-Player-$version-x64-setup.exe" latest.yml "EVB-Player-$version-amd64.deb" latest-linux.yml; do
            if ! grep -qx "$expected" <<< "$assets"; then
              echo "::error::Missing release asset $expected"
              exit 1
            fi
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
