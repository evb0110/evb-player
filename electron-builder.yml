appId: net.course-shelf.app
productName: Course Shelf
asar: true
files:
  - dist-electron/**
  - .output/public/**
  - package.json
  - resources/icon.png
directories:
  output: release
mac:
  # Icon Composer asset, compiled to Assets.car plus an .icns fallback. Needs Xcode 26 actool.
  icon: resources/AppIcon.icon
  category: public.app-category.education
  target:
    - dmg
  artifactName: Course-Shelf-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: resources/icon.ico
linux:
  icon: resources/icon.png
dmg:
  # Keep the Finder layout stable across machines. The background dimensions are
  # 600x450, so the coordinates below are in the same logical coordinate space.
  background: resources/dmg-background.png
  icon: null
  iconSize: 128
  contents:
    - x: 160
      y: 185
    - x: 440
      y: 185
      type: link
      path: /Applications
extraMetadata:
  main: dist-electron/electron/main.js
